services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aispeak
      POSTGRES_PASSWORD: aispeak
      POSTGRES_DB: aispeak
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aispeak"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://aispeak:aispeak@postgres:5432/aispeak
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: change-me-access-secret-000000000000000000
      JWT_REFRESH_SECRET: change-me-refresh-secret-11111111111111111
      LLM_PROVIDER: mock
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8080:8080"]
    # Run migrations + seed once, then boot the API.
    command: sh -c "node dist/db/migrate.js && node dist/db/seed.js && node dist/server.js"

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://aispeak:aispeak@postgres:5432/aispeak
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: change-me-access-secret-000000000000000000
      JWT_REFRESH_SECRET: change-me-refresh-secret-11111111111111111
      LLM_PROVIDER: mock
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: node dist/worker.js

volumes:
  pgdata:
